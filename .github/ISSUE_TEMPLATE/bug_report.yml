name: Bug report
description: Something in the collector behaves incorrectly or fails
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filling this in, please sanitize everything you paste.
        Replace host names, VM names, client names, IP addresses, object IDs,
        tokens and webhook URLs with placeholders. The shape of the data is what
        matters for triage, not the values.

        If you believe this is a security vulnerability, do not file it here.
        See the security policy instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the actual behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Describe what you expected instead, and how you know (for example, what the Veeam console shows).
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Run pwsh -File .\VeeamInventory\main.ps1 -ConfigPath ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Where it failed
      description: Roughly which stage of the run. Best guess is fine.
      options:
        - Configuration loading or validation
        - Credential store unlock
        - Authentication against the Veeam API
        - Infrastructure inventory (hosts or VMs)
        - Protected objects or backup catalog
        - Backup status evaluation
        - Job or repository normalization
        - Webhook delivery
        - Logging
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: job-types
    attributes:
      label: Job types involved
      multiple: true
      options:
        - Hyper-V VM Backup
        - VMware VM Backup
        - Windows Agent Backup
        - File Share Backup
        - Backup Copy
        - Windows Workstation
        - Windows Agent Policy
        - Other or unknown
        - Not job specific

  - type: input
    id: vbr-version
    attributes:
      label: Veeam Backup and Replication version
      placeholder: "12.3.1.1139"
    validations:
      required: true

  - type: input
    id: api-version
    attributes:
      label: REST API version
      description: The value of ApiVersion in your config file.
      placeholder: "1.3-rev1"
    validations:
      required: true

  - type: input
    id: ps-version
    attributes:
      label: PowerShell version
      description: Output of $PSVersionTable.PSVersion
      placeholder: "7.4.6"
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of git rev-parse --short HEAD
      placeholder: "a1b2c3d"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output (sanitized)
      description: Lines from the log directory, or the console output. Do not paste the whole file.
      render: text

  - type: textarea
    id: api-response
    attributes:
      label: Relevant API response (sanitized)
      description: The raw Veeam response for the object involved, if you can capture it. This is often the fastest path to a fix.
      render: json

  - type: checkboxes
    id: confirm
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I removed credentials, tokens, host names, VM names, client names and URLs from everything I pasted
          required: true
        - label: This is not a security vulnerability report
          required: true